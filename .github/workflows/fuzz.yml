name: Fuzz

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  decoders:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz every target
        run: |
          status=0
          for source in fuzz/fuzz_targets/*.rs; do
            target="${source##*/}"
            target="${target%.rs}"
            cargo +nightly fuzz run "$target" -- -max_total_time=60 -max_len=1048576 || status=1
          done
          exit "$status"
