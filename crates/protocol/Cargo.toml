[package]
name = "protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
# Re-exports the vendored wire crates to downstream tests that encode real packets.
wire-test-support = []

[dependencies]
async-platform = { path = "../async-platform" }
web-time.workspace = true
zeroize = "1"
block-transform = { path = "../block-transform" }
render-api = { path = "../render-api" }
anyhow.workspace = true
base64 = "0.22"
bridge = { path = "../bridge" }
bytes.workspace = true
futures.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true
xxhash-rust = { version = "0.8.15", features = ["xxh64"] }
valentine = { path = "vendor/valentine", default-features = false, features = ["bedrock_1_26_51"] }
jolyne = { path = "vendor/jolyne", default-features = false, features = ["client", "bedrock_1_26_51"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cap-std = "3.4.5"
cap-fs-ext = "3.4.5"
tokio = { workspace = true, features = ["fs", "net", "rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["js"] }

[dev-dependencies]
tempfile = "3"
test-time = { path = "../test-time" }
aes = "0.8"
ctr = "0.9"
flate2 = "1"
jsonwebtoken = "9.3"
p384 = { version = "0.13", features = ["ecdh", "pkcs8"] }
snap = "1.1"

[lints]
workspace = true
