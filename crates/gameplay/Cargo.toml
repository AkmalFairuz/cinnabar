[package]
name = "gameplay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
test-support = []

[dependencies]
web-time.workspace = true
block-transform = { path = "../block-transform" }
assets = { path = "../assets" }
client-world = { path = "../client-world" }
inventory = { path = "../inventory" }
player-state = { path = "../player-state" }
protocol = { path = "../protocol" }
semantic-input = { path = "../input" }
sim = { path = "../sim" }
world = { path = "../world" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["fs", "net", "rt-multi-thread"] }

[dev-dependencies]
protocol = { path = "../protocol", features = ["wire-test-support"] }

[lints]
workspace = true
